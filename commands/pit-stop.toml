description = "Run a full pit-stop on a project: load, find, propose, fix, ideas, report"
prompt = "Run the pit-stop skill on {{args}} (project path, optional --禁区 zones). Six phases in order: load, find (path:line evidence, tagged, strength badged), propose, fix (review loop, max 3 rounds), ideas (read-only, up to 3 anchored [idea] candidates with kill-probes, never built this run), report (changed/verified/unverified/remaining). Guardrails: banned list enforced, push/commit never automatic, evidence before claims, secrets redacted."
