description = "Run a full pit-stop on a project: load, find, propose, fix, ideas, report"
prompt = "Run the pit-stop skill on {{args}} (project path; optional --禁区 forbidden zones; optional --max-rounds N). Six phases in order: load (write MODE first), find (path:line evidence, tag: delete/stdlib/native/yagni/shrink/perf/security/obs, strength: Strong/Worth exploring/Speculative), propose, fix (round state in .pit-stop/run.md, review loop, max 3 rounds), ideas (read-only, up to 3 anchored [idea] candidates with kill-probes, never built this run), report (changed/verified/unverified/remaining). Guardrails: banned list enforced, push/commit never automatic, evidence before claims, secrets redacted."
