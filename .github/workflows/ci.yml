name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  hook-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (best-effort; the matrix also runs without it)
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present"
          else
            case "$RUNNER_OS" in
              Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq jq ;;
              macOS)   brew install jq ;;
              Windows) choco install -y jq ;;
            esac || echo "jq install failed on $RUNNER_OS; no-jq mode still runs"
          fi
      - name: Run guardrail test matrix (90 cases x jq/no-jq modes)
        run: bash hooks/test-block-destructive.sh
      - name: Doc and adapter consistency gate
        run: bash hooks/check-consistency.sh

  plugin-load:
    # Installs the plugin from this checkout into a scratch CLAUDE_CONFIG_DIR and
    # fails unless it reaches "enabled". Catches load-layer and manifest-schema
    # breakage that JSON parsing and the consistency gate cannot see.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code (major-pinned)
        run: npm install -g @anthropic-ai/claude-code@2
      - name: Validate the marketplace and plugin manifests (warnings are errors)
        run: claude plugin validate . --strict
      - name: Install the plugin from this checkout into a scratch config
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install -y pit-stop@pit-stop
          claude plugin list | tee plugin-list.txt
          grep -q "✔ enabled" plugin-list.txt || {
            echo "::error::plugin failed to load; see claude plugin list output above"
            exit 1
          }
