name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  hook-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (best-effort; the matrix also runs without it)
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present"
          else
            case "$RUNNER_OS" in
              Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq jq ;;
              macOS)   brew install jq ;;
              Windows) choco install -y jq ;;
            esac || echo "jq install failed on $RUNNER_OS; no-jq mode still runs"
          fi
      - name: Run guardrail test matrix (60 cases x jq/no-jq modes)
        run: bash hooks/test-block-destructive.sh
